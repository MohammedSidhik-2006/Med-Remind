<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d9488;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="512" height="512" fill="url(#grad)" rx="80"/>
  
  <!-- Medical Cross (pill shape) -->
  <g transform="translate(256, 256)">
    <!-- Pill outline -->
    <rect x="-90" y="-32" width="180" height="64" rx="32" fill="none" stroke="white" stroke-width="8"/>
    
    <!-- Pill divider -->
    <line x1="0" y1="-32" x2="0" y2="32" stroke="white" stroke-width="6"/>
    
    <!-- Medicine drop indicator -->
    <circle cx="-50" cy="-20" r="12" fill="white"/>
    <circle cx="50" cy="20" r="12" fill="white"/>
  </g>
  
  <!-- Heartbeat line -->
  <g transform="translate(256, 140)">
    <polyline points="50,50 80,50 100,20 120,50 180,50" stroke="white" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
